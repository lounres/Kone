apply:
  - //toolchain/templates/kotlin/jvm-common-settings.module-template.yaml

plugins:
  kotlin-compiler-plugin-test-setup: enabled

dependencies:
  - $libs.kotlin.compiler: compile-only
  - //libs/util/kotlinCompilerUtils

test-dependencies:
  - $libs.kotlin.test: runtime-only
  - $libs.kotlin.script.runtime: runtime-only
  - $libs.kotlin.annotations.jvm: runtime-only

  - $libs.kotlin.compiler
  - $libs.kotlin.reflect
  - $libs.kotlin.compiler.internal.test.framework

  - $libs.junit.jupiter
  - $libs.junit.platform.commons
  - $libs.junit.platform.launcher
  - $libs.junit.platform.suite.api