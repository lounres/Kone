# Gradle
#version=0.0.0-experiment
group=dev.lounres

versions=2026.7.26.18

koneUrl=https://lounres.dev
koneBaseUrl=/Kone/
koneGradlePluginsWebsite=https://lounres.dev/Kone/
koneGradlePluginsVcsUrl=https://github.com/lounres/Kone.git

#org.gradle.configureondemand=true
#org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-XX:MaxMetaspaceSize=4G

ignoreManualBugFixes=true

# Kotlin
kotlin.code.style=official

# Java
jvmTargetVersion=17
jvmVendor=graalvm
benchmatrksJvmTargetVersion=24
benchmatrksJvmVendor=graalvm
pluginRuntimeJvmTargetVersion=8
pluginRuntimeJvmVendor=temurin

# KMP
kotlin.suppressGradlePluginWarnings=IncorrectCompileOnlyDependencyWarning
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true
kotlin.incremental.js.ir=true

# Android
#android.useAndroidX=true
android.compileSdk=37
android.targetSdk=37
android.minSdk=24

# AtomicFU
kotlinx.atomicfu.enableJvmIrTransformation=true
kotlinx.atomicfu.enableNativeIrTransformation=true
kotlinx.atomicfu.enableJsIrTransformation=true

# Compose
org.jetbrains.compose.experimental.jscanvas.enabled=true

# Kotest
kotest.framework.classpath.scanning.config.disable=true
kotest.framework.config.fqn=KotestConfig

# Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# Publishing
#mavenCentralUsername=...
#mavenCentralPassword=...

#signing.keyId=...
#signing.password=...
#signing.secretKeyRingFile=...

#kone.publishing.hostname=...
#kone.publishing.ssh.username=...
#kone.publishing.ssh.password=...
#kone.publishing.destination.api=...
#kone.publishing.destination.site=...