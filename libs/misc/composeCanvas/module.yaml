product:
  type: kmp/lib
  platforms: [jvm, android, js, wasmJs]

description: "Set of libraries for experimental mathematics"

apply:
  - //toolchain/templates/structure/libs-misc.module-template.yaml
  - //toolchain/templates/libraries/compose.module-template.yaml
  - //toolchain/templates/libraries/kotlinx-serialization.module-template.yaml
  - //toolchain/templates/kone-compiler-plugins/contexts.module-template.yaml

dependencies:
  - //libs/main/contexts: exported
  - //libs/main/relations: exported
  - //libs/main/algebraic: exported
  - //libs/main/collections: exported
  - //libs/main/linearAlgebra: exported
  - //libs/main/computationalGeometry: exported

settings:
  publishing:
    artifactId: kone.misc.composeCanvas