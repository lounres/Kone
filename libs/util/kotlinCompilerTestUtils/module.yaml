product:
  type: kmp/lib
  platforms: [jvm, android, js, wasmJs]

description: "Set of libraries for experimental mathematics"

apply:
  - //toolchain/templates/structure/libs-util.module-template.yaml

dependencies@jvm:
  - $libs.kotlin.compiler: exported
  - $libs.kotlin.reflect: exported
  - $libs.kotlin.compiler.internal.test.framework: exported

  - $libs.junit.jupiter: exported
  - $libs.junit.platform.commons: exported
  - $libs.junit.platform.launcher: exported
  - $libs.junit.platform.suite.api: exported